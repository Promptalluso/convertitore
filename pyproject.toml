[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "convertitore"
version = "0.8.0"
description = "Convert and edit images, PDFs, video, audio and subtitles locally with a Shift-drag wheel"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
dependencies = [
  "Pillow==13.0.0",
  "pypdf==6.21.1",
  "pypdfium2==5.14.0",
  "imageio-ffmpeg==0.6.0",
  "rapidocr==3.10.0",
  "onnxruntime==1.31.0",
  "reportlab==5.0.1",
  "PySide6-Essentials==6.12.0",
  "shiboken6==6.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]
