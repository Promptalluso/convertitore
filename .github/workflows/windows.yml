name: Build Windows

# Builds and checks the Windows package on a clean GitHub Windows machine.
# Run it by hand from the Actions tab, or push a tag such as v0.8.0 to attach
# the zip to that release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Build package
        run: python packaging/build.py

      - name: Smoke test the packaged app
        run: python packaging/smoke.py dist

      - uses: actions/upload-artifact@v4
        with:
          name: Convertitore-Windows
          path: |
            dist/Convertitore-*-Windows.zip
            dist/Convertitore-*-Windows.zip.sha256

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" dist/Convertitore-*-Windows.zip --clobber
